# Pipeline de vérification équivalent à .gitlab-ci.yml (stage `quality`),
# complété par la publication vers le Registre Terraform public côté GitHub.
#
# Le job `publish-module` de .gitlab-ci.yml n'est pas repris ici : il publie
# le module dans le Terraform Module Registry intégré de GitLab via
# CI_JOB_TOKEN/CI_API_V4_URL, une API propre à GitLab sans équivalent direct
# côté GitHub Actions.
#
# Le Registre Terraform public (registry.terraform.io) n'expose pas d'API de
# publication : une fois ce dépôt connecté (une seule fois, via OAuth GitHub
# sur registry.terraform.io, cf. CONTRIBUTING.md), il republie automatiquement
# une nouvelle version du module à chaque tag Git conforme au versioning
# sémantique. Le job `release` ci-dessous se contente donc de créer la
# GitHub Release correspondant au tag, que le registre affiche comme notes
# de version.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.16
    steps:
      - uses: actions/checkout@v4
      - name: terraform fmt -check
        run: terraform fmt -check -diff -recursive .

  validate:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.16
    steps:
      - uses: actions/checkout@v4
      - name: terraform init
        run: terraform init
      - name: terraform validate
        run: terraform validate -no-color

  test:
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.16
    steps:
      - uses: actions/checkout@v4
      - name: terraform init
        run: terraform init
      - name: terraform test
        run: terraform test

  docs-check:
    runs-on: ubuntu-latest
    container:
      image: quay.io/terraform-docs/terraform-docs:0.24.0-amd64
    steps:
      - uses: actions/checkout@v4
      - name: terraform-docs --output-check
        run: terraform-docs -c .terraform-docs.yml --output-check .

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: []
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, skipping."
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
